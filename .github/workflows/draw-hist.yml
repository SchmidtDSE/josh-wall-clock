name: Draw histogram

# Render the comparison chart from the committed benchmark results
# (results/all_results.csv) and upload the PNG as a build artifact.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install fonts (DejaVu fallback for headless rendering)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install charting dependencies
        run: pip install -r requirements.txt

      - name: Render draw_hist.png
        run: python draw_hist.py

      - name: Upload chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draw_hist
          path: draw_hist.png
          if-no-files-found: error
